<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Redirecionando para ECO...</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      var pathSegments = window.location.pathname.split('/');
      var repo = pathSegments[1] === 'eco' ? '/eco/' : '/';
      window.location.replace(window.location.origin + repo);
    </script>
  </head>
  <body style="background-color: #050509; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecionando para o ECO...</p>
  </body>
</html>
